<div class="app-shell">
  <header class="app-header">
    <div class="brand-copy">
      <p class="eyebrow">{{ i18n.translate('eyebrow') }}</p>
      <h1>{{ i18n.translate('appTitle') }}</h1>
    </div>

    <nav class="language-switcher" [attr.aria-label]="i18n.translate('languageSelector')">
      @for (option of i18n.languages; track option.code) {
        <button
          type="button"
          [class.is-active]="i18n.language() === option.code"
          [attr.aria-pressed]="i18n.language() === option.code"
          [attr.lang]="option.code"
          [attr.dir]="option.direction"
          (click)="i18n.setLanguage(option.code)"
        >
          {{ i18n.translate(option.labelKey) }}
        </button>
      }
    </nav>
  </header>

  <main class="main-content">
    <section class="welcome-card" aria-labelledby="welcome-title">
      <span class="status-dot" aria-hidden="true"></span>
      <h2 id="welcome-title">{{ i18n.translate('welcome') }}</h2>
      <p>{{ i18n.translate('description') }}</p>

      <div class="status-card">
        <strong>{{ i18n.translate('statusTitle') }}</strong>
        <span>{{ i18n.translate('statusBody') }}</span>
      </div>
    </section>
  </main>
</div>
